<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#FAF6EE"/>
      <stop offset="100%" stop-color="#ECE5D6"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4E54"/>
      <stop offset="50%" stop-color="#2D5A3F"/>
      <stop offset="100%" stop-color="#1E4E54"/>
    </linearGradient>
  </defs>

  <!-- 外圈文化徽环 -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="2.6"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#D4AF37" stroke-width="0.8" stroke-dasharray="2 1.5" opacity="0.75"/>

  <!-- 大熊猫两耳 (沉稳墨色) -->
  <path d="M24,21 C17,21 13,27 15,35 C17,42 23,41 28,35 C30,32 29,23 24,21 Z" fill="#1A1C1B"/>
  <path d="M76,21 C83,21 87,27 85,35 C83,42 77,41 72,35 C70,32 71,23 76,21 Z" fill="#1A1C1B"/>

  <!-- 头部主轮廓 (温润白玉) -->
  <path d="M50,22 C31,22 21,36 21,54 C21,72 33,81 50,81 C67,81 79,72 79,54 C79,36 69,22 50,22 Z" fill="#FFFFFF" stroke="#E2DAC8" stroke-width="0.6"/>

  <!-- 标志性八字形眼圈 (庄重沉稳角度) -->
  <ellipse cx="36" cy="48" rx="8.5" ry="11" transform="rotate(-22 36 48)" fill="#1A1C1B"/>
  <ellipse cx="64" cy="48" rx="8.5" ry="11" transform="rotate(22 64 48)" fill="#1A1C1B"/>

  <!-- 聪慧眼睛 (灵动高光) -->
  <circle cx="37.5" cy="46.5" r="2.8" fill="#FFFFFF"/>
  <circle cx="38.2" cy="46" r="1.2" fill="#1A1C1B"/>
  <circle cx="62.5" cy="46.5" r="2.8" fill="#FFFFFF"/>
  <circle cx="61.8" cy="46" r="1.2" fill="#1A1C1B"/>

  <!-- 倒三角鼻头 -->
  <path d="M46.5,59 C46.5,59 50,57.5 53.5,59 C54.5,61.5 52,64 50,64 C48,64 45.5,61.5 46.5,59 Z" fill="#1A1C1B"/>

  <!-- 吻部曲线 -->
  <path d="M50,64 L50,67 M46,67 C48,68.5 50,68.5 50,67 C50,68.5 52,68.5 54,67" fill="none" stroke="#1A1C1B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 底部竹韵双托 (象征天府竹林清幽) -->
  <path d="M38,78 C44,75 50,77 50,77 C50,77 56,75 62,78 C57,80.5 50,80 50,80 C50,80 43,80.5 38,78 Z" fill="#2D5A3F" opacity="0.9"/>
</svg>