<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- 东方美学底盘：极简纯净温润宣纸色 -->
  <circle cx="50" cy="50" r="48" fill="#FAF7F2" stroke="#1E4E54" stroke-width="2.4"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.6"/>

  <!-- 阴阳留白·大熊猫经典墨黑结构 (Negative Space Zen Panda) -->
  <g fill="#181A19">
    <!-- 左耳与右耳：饱满外张黄金弧线 -->
    <path d="M22,23 C16,23 12,28 14,36 C16,42 22,41 27,35 C29,32 28,23 22,23 Z"/>
    <path d="M78,23 C84,23 88,28 86,36 C84,42 78,41 73,35 C71,32 72,23 78,23 Z"/>

    <!-- 标志性八字墨黑眼圈：微倾沉稳角度 -->
    <ellipse cx="36" cy="46" rx="8.5" ry="11.5" transform="rotate(-20 36 46)"/>
    <ellipse cx="64" cy="46" rx="8.5" ry="11.5" transform="rotate(20 64 46)"/>

    <!-- 灵动双目微光 (纯净留白点睛) -->
    <circle cx="37.5" cy="44.5" r="2.4" fill="#FFFFFF"/>
    <circle cx="62.5" cy="44.5" r="2.4" fill="#FFFFFF"/>

    <!-- 墨黑鼻头 -->
    <path d="M46.5,56 C46.5,56 50,54.5 53.5,56 C54.5,58.5 52,61 50,61 C48,61 45.5,58.5 46.5,56 Z"/>

    <!-- 经典稳重抱臂前躯与肩胛轮廓 (自然托起头部留白) -->
    <path d="M22,66 C18,72 16,78 18,84 C21,88 28,88 34,84 C40,80 44,76 50,76 C56,76 60,80 66,84 C72,88 79,88 82,84 C84,78 82,72 78,66 C72,60 62,68 50,68 C38,68 28,60 22,66 Z"/>
  </g>

  <!-- 底部青翠竹韵一点 (天府成都生态意象) -->
  <path d="M44,89 C48,87 50,88 50,88 C50,88 52,87 56,89 C53,90.5 50,90 50,90 C50,90 47,90.5 44,89 Z" fill="#2D5A3F"/>
</svg>